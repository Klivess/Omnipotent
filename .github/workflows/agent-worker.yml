name: Agent worker reliability
on:
  push:
    paths: ['AgentWorker/**', '.github/workflows/agent-worker.yml']
  pull_request:
    paths: ['AgentWorker/**', '.github/workflows/agent-worker.yml']
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Durable operation, overload, isolation and PTY tests
        working-directory: AgentWorker
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: for file in AgentWorker/deploy/*.sh AgentWorker/deploy/ka-desktop; do bash -n "$file" || exit; done
