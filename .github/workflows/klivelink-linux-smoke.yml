name: KliveLink Linux smoke

on:
  workflow_dispatch:

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Download installer
        run: curl -fsSL https://klive.dev/k/linux -o /tmp/klivelink-install.sh
      - name: Syntax check
        run: sh -n /tmp/klivelink-install.sh
      - name: Install
        run: sh /tmp/klivelink-install.sh
      - name: Verify
        run: |
          sleep 12
          pgrep -af klivelink-agent || true
          test -n "$(pgrep -f klivelink-agent)" || (tail -n 80 "$HOME/.local/state/klivelink/agent.log"; exit 1)
          tail -n 30 "$HOME/.local/state/klivelink/agent.log" || true
      - name: Uninstall
        run: sh /tmp/klivelink-install.sh --uninstall || true

  linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download installer
        run: curl -fsSL https://klive.dev/k/linux -o /tmp/klivelink-install.sh
      - name: Syntax check
        run: sh -n /tmp/klivelink-install.sh
      - name: Install
        run: sh /tmp/klivelink-install.sh
      - name: Verify
        run: |
          sleep 12
          pgrep -af klivelink-agent || true
          test -n "$(pgrep -f klivelink-agent)" || (tail -n 80 "$HOME/.local/state/klivelink/agent.log"; exit 1)
          tail -n 30 "$HOME/.local/state/klivelink/agent.log" || true
      - name: Uninstall
        run: sh /tmp/klivelink-install.sh --uninstall || true
